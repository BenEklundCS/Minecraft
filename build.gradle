import org.gradle.internal.os.OperatingSystem
import spotlesstools.ThisQualifierCleanup

plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.0.2'
}

application {
    mainClass = 'com.beneklund.minecraft.Main'
}

group = 'com.beneklund.minecraft'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        // No vendor pin: any JDK 21 compiles this identically, and pinning a vendor means
        // the build hard-fails if that exact vendor isn't discoverable. Foojay (see
        // settings.gradle) auto-downloads a 21 if none is found locally.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    options.release = 21
    options.compilerArgs += ['--enable-preview']
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED'
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.4'
def lwjglNatives = OperatingSystem.current().isWindows()
    ? 'natives-windows'
    : OperatingSystem.current().isMacOsX()
        ? (System.getProperty('os.arch').contains('arm') || System.getProperty('os.arch').contains('aarch64')
            ? 'natives-macos-arm64'
            : 'natives-macos')
        : (System.getProperty('os.arch').startsWith('arm') || System.getProperty('os.arch').startsWith('aarch64')
            ? 'natives-linux-arm64'
            : 'natives-linux')

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-openal'

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"

    implementation 'org.joml:joml:1.10.5'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.12'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-preview'
    // Inherits the project toolchain above; no separate launcher needed.
    // Default 512m isn't enough for integration tests that spin up a real
    // ChunkManager — generating+meshing its full load-radius footprint runs
    // into multiple hundred MB.
    maxHeapSize = '2g'
}

spotless {
    enforceCheck true
    java {
        // Strip redundant `this.` (AST-aware) before Palantir reformats the result.
        custom('removeRedundantThis') { String text -> ThisQualifierCleanup.clean(text) }
        palantirJavaFormat('2.91.0')
        importOrder()
        removeUnusedImports()
        // Lets us fence off hand-aligned data (e.g. vertex arrays) with
        // `// spotless:off` / `// spotless:on` so the formatter won't explode them.
        toggleOffOn()
    }
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
}

jar {
    manifest {
        attributes 'Main-Class': 'com.beneklund.minecraft.Main'
    }
}

// Point git at the versioned hooks in .githooks so a fresh clone picks up the
// pre-commit formatter the first time anyone builds.
tasks.register('installGitHooks', Exec) {
    description = 'Configures git to use the .githooks directory'
    group = 'build setup'
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}
tasks.named('build') { dependsOn 'installGitHooks' }
