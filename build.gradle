import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.beneklund.minecraft.Main'
}

group = 'com.beneklund.minecraft'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

def lwjglVersion = '3.3.3'
def lwjglNatives = OperatingSystem.current().isWindows()
    ? 'natives-windows'
    : OperatingSystem.current().isMacOsX()
        ? (System.getProperty('os.arch').contains('arm') || System.getProperty('os.arch').contains('aarch64')
            ? 'natives-macos-arm64'
            : 'natives-macos')
        : (System.getProperty('os.arch').startsWith('arm') || System.getProperty('os.arch').startsWith('aarch64')
            ? 'natives-linux-arm64'
            : 'natives-linux')

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    implementation 'org.joml:joml:1.10.5'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'com.beneklund.minecraft.Main'
    }
}
