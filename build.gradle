import spotlesstools.ThisQualifierCleanup

plugins {
    id 'com.diffplug.spotless' version '7.0.2' apply false
}

/*
 * The root project holds no code. Everything shared by the four modules — toolchain, formatter,
 * checkstyle, the JUnit wiring — is configured once here so a new module gets it by existing,
 * and the per-module build files stay short enough to read in one screen: they say what that
 * module is allowed to depend on, and nothing else.
 */
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.beneklund.minecraft'
    version = '1.0-SNAPSHOT'

    java {
        toolchain {
            // No vendor pin: any JDK 21 compiles this identically, and pinning a vendor means
            // the build hard-fails if that exact vendor isn't discoverable. Foojay (see
            // settings.gradle) auto-downloads a 21 if none is found locally.
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    compileJava {
        options.release = 21
        options.compilerArgs += ['--enable-preview']
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api:2.0.16'

        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED'
        // Chunks are flat arrays — 128 KiB each regardless of contents — so render distance costs
        // memory quadratically. Without this the JVM default caps at a quarter of physical RAM.
        // Overridable because the default is sized for this dev machine: on a 16 GB CI runner,
        // asking for 24 GB starves native allocations and OpenAL fails to open a device.
        maxHeapSize = providers.gradleProperty('gameHeap').getOrElse('24g')
    }

    // Unit tests: fast, no real ChunkManager, no thread pools. This is what `check`/`build`
    // and therefore CI run on every push. The integration exclusion is declared for every module
    // even though only :client has such a suite today, so moving one doesn't silently enrol it.
    test {
        useJUnitPlatform()
        jvmArgs '--enable-preview'
        exclude '**/integration/**'
    }

    spotless {
        enforceCheck true
        java {
            // Strip redundant `this.` (AST-aware) before Palantir reformats the result.
            custom('removeRedundantThis') { String text -> ThisQualifierCleanup.clean(text) }
            palantirJavaFormat('2.91.0')
            importOrder()
            removeUnusedImports()
            // Lets us fence off hand-aligned data (e.g. vertex arrays) with
            // `// spotless:off` / `// spotless:on` so the formatter won't explode them.
            toggleOffOn()
        }
    }

    checkstyle {
        toolVersion = '10.21.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = false
    }
}

// `./gradlew run` kept working after the split. The application plugin lives on :launcher now,
// so without this alias the one command everybody types would just say "task not found".
tasks.register('run') {
    group = 'application'
    description = 'Launches the game (delegates to :launcher:run).'
    dependsOn ':launcher:run'
}

// Point git at the versioned hooks in .githooks so a fresh clone picks up the
// pre-commit formatter the first time anyone builds.
tasks.register('installGitHooks', Exec) {
    description = 'Configures git to use the .githooks directory'
    group = 'build setup'
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}
subprojects { tasks.named('build') { dependsOn ':installGitHooks' } }
