name: Test and Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install display and Mesa GL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile and test
        run: ./gradlew build

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test/

      - name: Smoke test — verify game starts without crashing
        env:
          # The runner has no sound card, so alcOpenDevice returns NULL and the game throws in
          # initAudio. OpenAL Soft's null backend accepts the device and discards the audio.
          ALSOFT_DRIVERS: "null"
        run: |
          # Start a virtual framebuffer (no physical display needed)
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 1

          # -PgameHeap: the build's default heap is sized for a dev machine and exceeds this
          # runner's physical RAM, which starves native allocations during startup.
          DISPLAY=:99 ./gradlew run -PgameHeap=2g > game-smoke.log 2>&1 &
          GAME_PID=$!

          # Gradle's own startup time varies a lot between runs, so a fixed timeout can kill the
          # game before it has initialised anything and still look like a pass. Wait for the game's
          # own "startup complete" line instead, and fail if the process dies first.
          STARTED=0
          for _ in $(seq 1 120); do
            if grep -q "startup complete" game-smoke.log; then STARTED=1; break; fi
            kill -0 "$GAME_PID" 2>/dev/null || break
            sleep 1
          done

          # A few seconds of running the loop, so a crash on the first frames counts too.
          if [ "$STARTED" -eq 1 ]; then
            sleep 5
            kill -0 "$GAME_PID" 2>/dev/null || STARTED=0
          fi

          kill "$GAME_PID" 2>/dev/null || true
          pkill -f com.beneklund.minecraft.Main 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          if [ "$STARTED" -ne 1 ]; then
            echo "::error::Game did not start or crashed in the first frames. Check game-smoke.log."
            tail -n 60 game-smoke.log
            exit 1
          fi
          echo "Smoke test passed"

      - name: Upload smoke test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log
          path: game-smoke.log
